name: parallel_run 单个失败 job 报告其退出码（含正例对照）
points: 2
run: |
  source "$EXERCISE_DIR/starter/lib/parallel.sh"

  # 正例：成功 job 报告 rc=0、整体 rc=0
  out=$(printf '%s\n' $'ok\ttrue' | parallel_run 1)
  rc=$?
  echo "$out"
  echo "positive-rc=$rc"

  # 反例：失败 job 报告其退出码、整体 rc=1
  out=$(printf '%s\n' $'fail\texit 17' | parallel_run 1)
  rc=$?
  echo "$out"
  echo "negative-rc=$rc"
expect:
  exit: 0
  stdout: |
    ok	0
    positive-rc=0
    fail	17
    negative-rc=1
