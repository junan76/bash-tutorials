name: lock_acquire 区分活跃锁与空闲（含正例对照）
points: 3
run: |
  source "$EXERCISE_DIR/../02-conditions/solution/lib/check.sh"
  source "$EXERCISE_DIR/starter/lib/lock.sh"

  # 活跃锁：当前进程占着，应当拒绝
  echo "$$" > job.lock
  if lock_acquire job.lock 2>/dev/null; then
    echo "wrong-acquired"
  else
    echo "rejected-active"
  fi
  rm -f job.lock

  # 释放后再来：应当成功
  if lock_acquire job.lock 2>/dev/null; then
    echo "acquired-free"
  else
    echo "wrong-rejected"
  fi
expect:
  exit: 0
  stdout: |
    rejected-active
    acquired-free
