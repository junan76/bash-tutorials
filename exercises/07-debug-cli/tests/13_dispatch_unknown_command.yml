name: dispatch 未知命令 → rc=1 + stderr
points: 1
run: |
  source "$EXERCISE_DIR/starter/lib/cli.sh"
  if dispatch nope 2>err.log; then
    echo "unexpected-success"
  else
    rc=$?
    if (( rc == 1 )) && grep -q 'unknown command' err.log; then
      echo "unknown-command-ok"
    else
      echo "rc=$rc"
      cat err.log
    fi
  fi
expect:
  exit: 0
  stdout: |
    unknown-command-ok
