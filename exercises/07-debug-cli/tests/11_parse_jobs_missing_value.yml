name: parse_args --jobs 缺值 → rc=2 + stderr
points: 1
run: |
  source "$EXERCISE_DIR/starter/lib/cli.sh"
  if parse_args --jobs 2>err.log; then
    echo "unexpected-success"
  else
    rc=$?
    if (( rc == 2 )) && grep -q 'requires a value' err.log; then
      echo "missing-value-ok"
    else
      echo "rc=$rc"
      cat err.log
    fi
  fi
expect:
  exit: 0
  stdout: |
    missing-value-ok
