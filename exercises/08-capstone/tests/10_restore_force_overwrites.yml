name: restore_snapshot --force 覆盖非空 dest
points: 2
run: |
  source "$EXERCISE_DIR/starter/lib/maint.sh"
  mkdir src
  echo "from-src" > src/a.txt
  mkdir dest
  echo "preexisting" > dest/keep.txt
  echo "stale"       > dest/old.txt
  restore_snapshot src dest --force
  rc=$?
  echo "rc=$rc"
  ls dest | sort
  cat dest/a.txt
expect:
  exit: 0
  stdout: |
    rc=0
    a.txt
    from-src
