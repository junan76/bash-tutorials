name: strip-prefix 移除文件名前缀
points: 3
setup: |
  mkdir photos
  touch photos/IMG_001.jpg photos/IMG_002.jpg photos/other.png
run: bash "$EXERCISE_DIR/starter/rename.sh" strip-prefix IMG_ photos
expect:
  exit: 0
  files:
    - path: photos/001.jpg
      exists: true
    - path: photos/002.jpg
      exists: true
    - path: photos/IMG_001.jpg
      exists: false
    - path: photos/IMG_002.jpg
      exists: false
    - path: photos/other.png
      exists: true
